name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The daily relock dispatches it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:

jobs:
  check:
    # ubuntu-latest is ubuntu-24.04 today (runner-images README); pinned so it cannot move
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ATS2
        run: |
          sudo apt-get install -y -q libgmp-dev
          # the ATS2 tarball at a fixed commit of ats-lang.github.io, checked by its sha256
          curl -fsSL "https://raw.githubusercontent.com/ats-lang/ats-lang.github.io/de8a182827cc560e9ca6cfba81200539fd49b546/FROZEN000/ATS-Postiats/ATS2-Postiats-gmp-0.4.2.tgz" -o /tmp/ats2.tgz
          echo "73c64f1480df170d65aef5c7e5648677898855a2fa9ea2f3c0502f1b6d7e1b80  /tmp/ats2.tgz" | sha256sum -c -
          mkdir -p ~/.ats2
          tar -xzf /tmp/ats2.tgz -C ~/.ats2
          cd ~/.ats2/ATS2-Postiats-gmp-0.4.2
          make -j$(nproc) -C src/CBOOT patsopt
          mkdir -p bin
          cp src/CBOOT/patsopt bin/patsopt
          mkdir -p ~/.bats
          ln -sf ~/.ats2/ATS2-Postiats-gmp-0.4.2 ~/.bats/ats2

      # The compiler at the commit .github/bats-version pins (bats-lang/repository-prototype#269)
      - name: Read the compiler pin
        id: pins
        run: echo "bats=$(tr -d '[:space:]' < .github/bats-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout bats compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bats-lang/bats
          ref: ${{ steps.pins.outputs.bats }}
          path: bats-src

      - name: Build bats from checked-in bootstrap C
        run: |
          cp -R bats-src/bootstrap/c ~/bats-c
          make -j$(nproc) -C ~/bats-c PATSHOME=$HOME/.ats2/ATS2-Postiats-gmp-0.4.2 debug/bats
          mkdir -p ~/bats-bin
          cp ~/bats-c/debug/bats ~/bats-bin/bats
          rm -rf bats-src

      - name: bats check
        run: |
          export PATH=~/bats-bin:$PATH
          # The package repository at the commit .github/repository-version pins
          # (bats-lang/repository-prototype#269): what the lock and the test packages resolve against
          git init -q ~/repository
          git -C ~/repository fetch -q --depth 1 https://github.com/bats-lang/repository-prototype.git "$(tr -d '[:space:]' < .github/repository-version)"
          git -C ~/repository checkout -q FETCH_HEAD
          # The committed lock (bats-lang/repository-prototype#269): never relocked here
          test -f bats.lock || { echo "::error::bats.lock is missing: run 'bats lock --repository <dir>' and commit it"; exit 1; }
          bats check --repository ~/repository

      - name: Static tests
        run: |
          export PATH=~/bats-bin:$PATH
          tests/static/run.sh ~/repository

      - name: Install lld (wasm linker)
        run: sudo apt-get install -y -q lld

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3

      - name: Dynamic tests
        run: |
          export PATH=~/bats-bin:$PATH
          (cd tests/dynamic && npm ci --no-audit --no-fund)
          tests/dynamic/run.sh ~/repository
